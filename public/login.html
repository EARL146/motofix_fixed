    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - MotoFix</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #0d0d0d;
                color: #fff;
                font-family: 'Nunito', sans-serif;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            /* Navbar */
            .navbar {
                background: #0d0d0d;
                border-bottom: 2px solid #ee4d2d;
                padding: 0;
            }
            .navbar-inner {
                max-width: 1280px;
                margin: 0 auto;
                padding: 15px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                box-sizing: border-box;
            }

            .navbar-brand {
                font-family: 'Bebas Neue', cursive;
                font-size: 28px;
                font-weight: bold;
                color: #ee4d2d;
                text-decoration: none;
                letter-spacing: 2px;
            }

            .navbar-links {
                display: flex;
                gap: 20px;
                align-items: center;
            }

            .navbar-links a {
                color: #fff;
                text-decoration: none;
                font-size: 14px;
                transition: color 0.3s;
                cursor: pointer;
            }

            .navbar-links a:hover {
                color: #ee4d2d;
            }

            /* Main Container */
            .auth-container {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px 20px;
            }

            .auth-box {
                background: #1a1a1a;
                border: 2px solid #ee4d2d;
                border-radius: 10px;
                padding: 40px;
                width: 100%;
                max-width: 400px;
                box-shadow: 0 0 20px rgba(238, 77, 45, 0.3);
            }

            .auth-box h1 {
                font-family: 'Bebas Neue', cursive;
                font-size: 32px;
                color: #ee4d2d;
                margin-bottom: 10px;
                text-align: center;
                letter-spacing: 1px;
            }

            .auth-box p {
                text-align: center;
                color: #999;
                margin-bottom: 30px;
                font-size: 14px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: #ddd;
                font-weight: 600;
                font-size: 14px;
            }

            .form-group input {
                width: 100%;
                padding: 12px 15px;
                border: 2px solid #333;
                background: #0d0d0d;
                color: #fff;
                border-radius: 5px;
                font-family: 'Nunito', sans-serif;
                font-size: 14px;
                transition: border-color 0.3s;
            }

            .form-group input:focus {
                outline: none;
                border-color: #ee4d2d;
                box-shadow: 0 0 10px rgba(238, 77, 45, 0.3);
            }

            .login-btn {
                width: 100%;
                padding: 14px;
                background: #ee4d2d;
                color: #fff;
                border: none;
                border-radius: 5px;
                font-family: 'Bebas Neue', cursive;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
                letter-spacing: 1px;
                transition: background 0.3s, transform 0.2s;
                margin-top: 10px;
            }

            .login-btn:hover {
                background: #d63d1f;
                transform: scale(1.02);
            }

            .login-btn:active {
                transform: scale(0.98);
            }

            .auth-footer {
                text-align: center;
                margin-top: 25px;
                padding-top: 20px;
                border-top: 1px solid #333;
            }

            .auth-footer p {
                color: #999;
                font-size: 14px;
                margin: 0;
            }

            .auth-footer a {
                color: #ee4d2d;
                text-decoration: none;
                font-weight: 600;
                transition: color 0.3s;
            }

            .auth-footer a:hover {
                color: #ff6b47;
            }

            .error-message {
                color: #ff4444;
                background: rgba(255, 68, 68, 0.1);
                border: 1px solid #ff4444;
                padding: 12px;
                border-radius: 5px;
                margin-bottom: 20px;
                font-size: 14px;
                display: none;
            }

            .success-message {
                color: #44ff44;
                background: rgba(68, 255, 68, 0.1);
                border: 1px solid #44ff44;
                padding: 12px;
                border-radius: 5px;
                margin-bottom: 20px;
                font-size: 14px;
                display: none;
            }

            .loading {
                display: none;
                text-align: center;
                color: #ee4d2d;
                font-size: 14px;
                margin-top: 10px;
            }

            @media (max-width: 600px) {
                .auth-box {
                    padding: 30px 20px;
                }
                .auth-box h1 {
                    font-size: 28px;
                }
                .navbar-inner {
                    padding: 10px 15px;
                }
                .navbar-brand {
                    font-size: 22px;
                }
            }
        </style>
    </head>

        <!-- Main Content -->
        <div class="auth-container">
            <div class="auth-box">
                <h1>LOGIN</h1>
                <p>Welcome back to MotoFix</p>

                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="admin@motofix.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-btn">LOGIN</button>
                    <div class="loading" id="loading">
                        <p>Logging in...</p>
                    </div>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Register here</a></p>
                </div>
            </div>
        </div>

        <script>
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const loading = document.getElementById('loading');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Clear messages
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
                loading.style.display = 'none';

                // Validate inputs
                if (!emailInput.value.trim()) {
                    showError('Please enter your email address');
                    return;
                }

                if (!passwordInput.value.trim()) {
                    showError('Please enter your password');
                    return;
                }

                loading.style.display = 'block';

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: emailInput.value.trim(),
                            password: passwordInput.value
                        })
                    });

                    const data = await response.json();
                    loading.style.display = 'none';

                    if (!response.ok) {
                        showError(data.message || 'Login failed. Please try again.');
                        return;
                    }

                    // Success
                    showSuccess('Login successful! Redirecting...');
                    
                    // Store user session
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('sessionToken', data.token || '');

                    // Redirect based on role
                    setTimeout(() => {
                        const role = data.user?.role || '';
                        if (role === 'admin') {
                            localStorage.setItem('mf_user', JSON.stringify({
                                token: data.token,
                                role: 'admin',
                                id: data.user.id,
                                name: data.user.name || data.user.full_name || 'Admin',
                                full_name: data.user.name || data.user.full_name || 'Admin',
                                email: data.user.email || ''
                            }));
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);

                } catch (error) {
                    loading.style.display = 'none';
                    showError('Error: ' + error.message);
                }
            });

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }

            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
            }

            // Auto-fill for demo (admin credentials)
            if (window.location.search.includes('demo')) {
                document.getElementById('email').value = 'admin@motofix.com';
                document.getElementById('password').value = 'admin123';
            }
        </script>
